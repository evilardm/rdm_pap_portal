<div class="login-page">
  <div class="login-card">
    <!-- Logo -->
    <div class="login-logo">
      <div class="logo-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 01-8 0"/>
        </svg>
      </div>
      <span class="logo-name">CompraApp</span>
    </div>

    <h1 class="login-title">Bienvenido de nuevo</h1>
    <p class="login-subtitle">Ingresa tus credenciales para continuar</p>

    <!-- Error alert -->
    <div *ngIf="error()" class="alert alert-error">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      {{ error() }}
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-field">
        <label class="field-label" for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="field-input"
          [class.error]="form.get('email')?.invalid && form.get('email')?.touched"
          placeholder="usuario@empresa.com"
          autocomplete="email"
        />
        <span *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="field-error">
          Ingresa un correo válido
        </span>
      </div>

      <div class="form-field">
        <label class="field-label" for="password">Contraseña</label>
        <div class="input-wrapper">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            class="field-input"
            [class.error]="form.get('password')?.invalid && form.get('password')?.touched"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <button type="button" class="toggle-password" (click)="showPassword.set(!showPassword())">
            <svg *ngIf="!showPassword()" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword()" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <span *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="field-error">
          La contraseña es requerida
        </span>
      </div>

      <button type="submit" class="btn-primary" [disabled]="form.invalid || loading()">
        <svg *ngIf="loading()" class="spinner" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12a9 9 0 11-6.219-8.56"/>
        </svg>
        {{ loading() ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
    </form>

  </div>
</div>
